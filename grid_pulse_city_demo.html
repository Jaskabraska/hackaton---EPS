<style>
:root{--bg:#0b111d;--panel:#121a2b;--panel2:#1a2438;--line:#27324a;--txt:#e8eef8;--mut:#8593ad;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);

#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:linear-gradient(180deg,#13203a,#0d1424);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
header h1 .sub{color:var(--mut);font-weight:400;font-size:11px;margin-left:6px}
.demo-badge{background:#3a2a12;color:#f2c14e;border:1px solid #6b4e1e;border-radius:5px;font-size:10px;font-weight:700;padding:2px 7px;letter-spacing:.5px}
.kpis{display:flex;gap:7px;margin-left:auto}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px;min-width:78px}
.kpi .lab{font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.kpi .val{font-size:15px;font-weight:800;margin-top:1px}
.kpi.bad .val{color:var(--crit)} .kpi.warn .val{color:var(--warn)} .kpi.good .val{color:var(--ok)}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;background:#0a1120}
svg#map{width:100%;height:100%;display:block}
.dist-label{font-size:15px;font-weight:800;letter-spacing:4px;opacity:.32;text-transform:uppercase}
.street{stroke:#16203360;stroke-width:6} .street.main{stroke:#1b2740a0;stroke-width:10}
.bldg{fill:#141d30;stroke:#1d293f;stroke-width:.5}
.win{fill:#f2c14e;opacity:.5}
.edge{stroke-linecap:round;cursor:pointer}
.flow{stroke-dasharray:2 7;animation:dash 1s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-18}}
.node{cursor:pointer}
.node text{font-size:8.5px;fill:#aebbd2;text-anchor:middle;font-weight:600;pointer-events:none}
.prodGlow{filter:drop-shadow(0 0 5px #ffcf4d88)}
aside{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.flowstrip{display:flex;align-items:center;gap:4px;padding:9px 12px;border-bottom:1px solid var(--line);background:#0e1626;font-size:10.5px}
.fstep{flex:1;text-align:center;color:var(--mut);position:relative}
.fstep b{display:block;color:#cdd8ea;font-size:11px}
.fstep.act b{color:var(--accent)}
.fstep .n{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--panel2);font-size:9px;line-height:16px;margin-bottom:2px}
.fstep.act .n{background:var(--accent);color:#06101e}
.arrow{color:#475569}
.scroll{overflow-y:auto;padding:12px;flex:1}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:11px}
.card h3{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);display:flex;align-items:center;gap:6px}
.ai{background:linear-gradient(160deg,#15233d,#101a2e);border:1px solid #2a3e63}
.ai h3{color:#7fc0ff}
.ai p{margin:6px 0;line-height:1.5;color:#dde6f3}
.ai .tag{display:inline-block;background:#0e1d33;border:1px solid #2a3e63;border-radius:6px;padding:2px 7px;font-size:10px;color:#9fc4ee;margin:2px 3px 2px 0}
.alert{border-left:3px solid var(--mut);background:var(--panel2);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:.1s}
.alert:hover{background:#1f2b42}
.alert.CRITICAL{border-left-color:var(--crit)} .alert.HIGH{border-left-color:var(--hot)}
.alert.MEDIUM{border-left-color:var(--warn)} .alert.LOW{border-left-color:var(--accent)}
.alert .sev{font-size:9px;font-weight:800;letter-spacing:.5px;padding:1px 6px;border-radius:4px}

.sev.MEDIUM{background:#3a3312;color:#f2d36b} .sev.LOW{background:#12263a;color:#7fc0ff}
.alert .ti{font-weight:700;margin:5px 0 2px;font-size:12px;line-height:1.3}
.alert .el{font-size:10px;color:var(--mut)}
.rec{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed #283448;font-size:11.5px}
.rec:last-child{border:0}
.rec .eff{color:var(--mut);font-size:10px}
.rec .cz{color:var(--ok);font-weight:700;white-space:nowrap}
.pred{display:flex;gap:8px;margin-bottom:7px}
.pwid{flex:1;background:#0e1626;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}
.pwid .ic{font-size:17px} .pwid .l{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.pwid .v{font-size:11px;font-weight:700;margin-top:2px}
.sig{font-size:10.5px;color:#b9c6db;padding:3px 0;border-bottom:1px dashed #283448}
.sig:last-child{border:0} .sig b{color:#fff}
.save{background:#10241c;border:1px solid #1f5a3f;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:11px}
.save b{color:var(--ok);font-size:15px}
#inspector{position:absolute;left:14px;bottom:14px;width:280px;background:#0c1424f2;border:1px solid var(--line);border-radius:12px;padding:12px;display:none;box-shadow:0 10px 40px #000a;backdrop-filter:blur(4px)}
#inspector h4{margin:0 0 2px;font-size:13px} #inspector .sub{color:var(--mut);font-size:10px;margin-bottom:8px}
.metric{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #283448;font-size:11.5px}
.metric:last-child{border:0} .metric b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#1d2840;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
#tip{position:absolute;pointer-events:none;background:#0b1322f0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px;opacity:0;transition:.08s;z-index:20;max-width:210px}
#tip .row{display:flex;justify-content:space-between;gap:12px;color:#c3cdde}#tip b{color:#fff}
.legend{position:absolute;top:12px;left:12px;background:#0c1424d0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:10.5px;max-width:225px}
.legend .r{display:flex;align-items:center;gap:7px;margin:3px 0;color:#c3cdde}
.legend svg{flex:none}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:20px}
#modal h2{margin:0 0 4px;font-size:17px}
.f5{margin:11px 0;padding:10px 12px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--accent)}
.f5 .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;margin-bottom:3px}
.f5 p{margin:0;line-height:1.5;color:#dce5f2}
.fin{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fin div{flex:1;min-width:120px;background:#0e1626;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.fin .l{font-size:9px;color:var(--mut);text-transform:uppercase}.fin .v{font-size:15px;font-weight:800;margin-top:2px}
.closeb{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 11px;cursor:pointer}
button.run{background:var(--accent);color:#06101e;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:11px}
.illu{font-size:9.5px;color:#6f7c93;font-style:italic;margin-top:4px}
</style></head>

function mix(a,b,t){const A=hx(a),C=hx(b);return`rgb(${r(A[0],C[0])},${r(A[1],C[1])},${r(A[2],C[2])})`;function r(x,y){return Math.round(x+(y-x)*t)}}
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}

function near(x,y){return G.nodes.some(n=>Math.abs(n.x-x)<34&&Math.abs(n.y-y)<30)}
for(const d in bands){const[y0,y1]=bands[d];let c=0,tries=0;

 else if(t=='substation'){g.appendChild(el('rect',{x:-11,y:-11,width:22,height:22,rx:4,fill:c,stroke:'#0a1120','stroke-width':1.5}));

 else if(t=='chp'){g.appendChild(el('circle',{cx:0,cy:1,r:12,fill:c,stroke:'#0a1120','stroke-width':1.5}));

   g.appendChild(el('circle',{cx:0,cy:0,r:4,fill:'#fff7d6'}));}
 else if(t=='wind'){g.appendChild(el('circle',{cx:0,cy:0,r:11,fill:c,stroke:'#0a1120','stroke-width':1.5}));
   for(let i=0;i<3;i++)g.appendChild(el('line',{x1:0,y1:0,x2:8*Math.cos(i*2.1),y2:8*Math.sin(i*2.1),stroke:'#0a1120','stroke-width':1.8}));}
 else if(t=='storage'){g.appendChild(el('rect',{x:-12,y:-9,width:24,height:18,rx:3,fill:c,stroke:'#0a1120','stroke-width':1.5}));

 else{ // house / load / prosumer / critical
   g.appendChild(el('path',{d:'M -11 6 L -11 -2 L 0 -12 L 11 -2 L 11 6 Z',fill:c,stroke:'#0a1120','stroke-width':1.5}));

   <div class="el">▸ klikni pro detail (co/proč/akce/alternativa/dopad + Kč)</div></div>`).join('')+'</div>';

const recHtml=`<div class="card"><h3>🛠️ Doporučení pro provoz</h3>`+
 re.actions_ranked.map(r=>`<div class="rec"><div><div>${r.action}</div><div class="eff">${r.effect} · ${r.type}</div></div><div class="cz">${r.cost_czk?fmt(r.cost_czk)+' Kč':'0 Kč'}</div></div>`).join('')+
 `<div class="save">Souhrn: zásah <b style="font-size:12px;color:#fff">${fmt(re.total_intervention_czk)} Kč</b> → vyhnutá ztráta <b style="font-size:12px;color:#fff">${fmt(re.total_avoided_czk)} Kč</b><br>Čistá úspora <b>${fmt(re.net_saving_czk_day)} Kč/den</b></div>
 <div class="illu">Finanční hodnoty jsou ilustrativní (demo).</div></div>`;

const predHtml=`<div class="card"><h3>🌦️ Predictive data integration <span style="color:#6f7c93;font-weight:400;text-transform:none;letter-spacing:0">(fiktivní)</span></h3>
 <div class="pred">
  <div class="pwid"><div class="ic">🌡️</div><div class="l">Počasí 2h</div><div class="v">${PR.weather.forecast_2h}</div><div class="l">${PR.weather.load_effect_pct}</div></div>
  <div class="pwid"><div class="ic">🛰️</div><div class="l">Oblačnost</div><div class="v">${PR.satellite.forecast_tomorrow_noon}</div><div class="l">${PR.satellite.solar_effect}</div></div>
  <div class="pwid"><div class="ic">🌬️</div><div class="l">Vítr 2h</div><div class="v">${PR.wind.forecast_2h}</div><div class="l">z ${PR.wind.now}</div></div>
 </div>
 <div style="font-size:10px;color:#8593ad;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 3px">Propojení signálů s chováním sítě</div>
 ${PR.external_signals.map(s=>`<div class="sig">⚡ <b>${s.signal}</b> — ${s.rule} <span style="color:#7fc0ff">→ ${s.applies_to}</span></div>`).join('')}
 <div class="illu">Externí signály jsou fiktivní; demonstrují, jak by se predikce propsala do alertů a doporučení.</div></div>`;

document.getElementById('side').innerHTML=ai+alertsHtml+recHtml+predHtml;

// ---- alert modal ----
function openAlert(id){const a=AL.alerts.find(x=>x.id===id);const f=a.financial;
 const pb=a.predictive_basis?`<div class="f5" style="border-left-color:#b07cf0"><div class="k" style="color:#b07cf0">Prediktivní základ</div><p>${Object.entries(a.predictive_basis).map(([k,v])=>k+': '+v).join(' · ')}</p></div>`:'';
 document.getElementById('modalbox').innerHTML=`<button class="closeb" onclick="closeM()">✕ zavřít</button>
  <span class="sev ${a.severity}">${a.severity}</span> <span class="el" style="color:#8593ad">${a.element}</span>
  <h2>${a.title}</h2>
  <div class="f5"><div class="k">1 · Co se stalo / co se blíží</div><p>${a.what}</p></div>
  <div class="f5"><div class="k">2 · Proč alert vznikl (signál / pravidlo / limit)</div><p>${a.why}</p></div>
  <div class="f5"><div class="k">3 · Co se má udělat</div><p>${a.action}</p></div>
  <div class="f5"><div class="k">4 · Co udělat jinak oproti současnému stavu</div><p>${a.alternative}</p></div>
  <div class="f5" style="border-left-color:#ef4d4d"><div class="k" style="color:#ef4d4d">5 · Očekávaný dopad a riziko, pokud nic neuděláme</div><p>${a.impact_risk}</p></div>
  ${pb}
  <div class="fin">
   <div><div class="l">Náklad zásahu</div><div class="v" style="color:#f0883e">${fmt(f.intervention_cost_czk)} Kč</div></div>
   <div><div class="l">Vyhnutá ztráta</div><div class="v" style="color:#2fbf85">${fmt(f.avoided_penalty_czk)} Kč</div></div>
   <div><div class="l">Čistá úspora</div><div class="v" style="color:#2fbf85">${fmt(f.net_saving_czk)} Kč</div></div>
  </div><div class="illu">${f.note} · Hodnoty ilustrativní.</div>`;
 document.getElementById('modal').style.display='flex';}
function closeM(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id=='modal')closeM()});
function replay(){let i=0;renderFlow(0);const t=setInterval(()=>{i++;renderFlow(i);if(i>=3)clearInterval(t)},420)}
</script></body></html>
